# Credit Risk Analytics Configuration

# Model Settings
model:
  # Default classifier settings
  classifier:
    type: random_forest
    params:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      random_state: 42
      class_weight: balanced
  
  # Default regressor settings
  regressor:
    type: gradient_boosting
    params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      random_state: 42

# Data Settings
data:
  raw_path: data/raw/
  processed_path: data/processed/
  interim_path: data/interim/
  
  # Target columns
  targets:
    classification: default
    regression: risk_score
    time_series: future_risk
  
  # Train/test split
  test_size: 0.2
  validation_size: 0.1
  random_state: 42

# Feature Engineering
features:
  # Categorical encoding method
  categorical_encoding: onehot
  
  # Numeric scaling method
  numeric_scaling: standard
  
  # Missing value handling
  missing_strategy: median
  
  # Feature selection
  selection:
    method: mutual_info
    top_k: 30

# Hyperparameter Tuning
tuning:
  strategy: random
  n_trials: 100
  cv_folds: 5
  scoring: roc_auc

# Evaluation
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - ks_statistic
    - gini

# Monitoring
monitoring:
  drift_threshold: 0.25
  performance_threshold: 0.1
  alert_channels:
    - console
    # - email
    # - slack

# Logging
logging:
  level: INFO
  log_file: logs/credit_risk.log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Paths
paths:
  models: models/
  reports: reports/
  figures: reports/figures/
