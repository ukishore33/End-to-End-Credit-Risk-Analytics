# Model Configuration

# Logistic Regression
logistic_regression:
  max_iter: 1000
  random_state: 42
  solver: 'liblinear'
  class_weight: 'balanced'

# Random Forest
random_forest:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1
  class_weight: 'balanced'

# Gradient Boosting
gradient_boosting:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 5
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42

# XGBoost
xgboost:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 5
  random_state: 42
  objective: 'binary:logistic'

# Feature Engineering
feature_engineering:
  create_income_features: true
  create_demographic_features: true
  create_interaction_features: true
  apply_log_transformation: true

# Data Preprocessing
preprocessing:
  missing_value_strategy: 'median'  # median, mean, mode
  encoding_strategy: 'label'  # label, onehot, target
  outlier_handling: true
  feature_scaling: 'standard'  # standard, minmax, robust

# Training Configuration
training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  cv_folds: 5
  stratify: true

# Model Evaluation
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
  threshold: 0.5
